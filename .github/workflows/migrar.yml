name: migrar
on:
  push:
    branches: [main]
    paths: ['migrations/**']

permissions:
  contents: read

concurrency:
  group: migrar-d1
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Aplica as migrações no D1 remoto
        run: npx --yes wrangler d1 migrations apply NOME_DO_BANCO --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
