name: revisao-ia
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: revisao-ia-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instala o Copilot CLI
        run: npm install -g @github/copilot

      - name: Monta o prompt
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/${BASE_REF}...HEAD" > diff.txt
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em português e em até 10 itens: segredos expostos,"
            echo "SQL montado por concatenação em vez de prepare().bind(), e erros de lógica."
            echo '```diff'
            head -c 20000 diff.txt
            echo '```'
          } > prompt.txt

      - id: ia
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo.

      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPONSE_FILE: ${{ steps.ia.outputs.response-file }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RESPONSE_FILE"
